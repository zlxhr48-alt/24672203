<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 포즈 맞추기 게임 + 데이터 저장</title>
    <style>
        :root {
            --primary-color: #00bcd4;
            --secondary-color: #006064;
            --bg-color: #e0f7fa;
            --accent-color: #d81b60;
            --warning-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 { color: var(--secondary-color); margin-top: 0; }

        #canvas-container {
            position: relative;
            margin: 20px auto;
            width: 200px;
            height: 200px;
            border: 6px solid #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #mission-box {
            background-color: #fff9c4;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 2px dashed #fbc02d;
            position: relative;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #timer-display {
            font-weight: bold;
            color: var(--warning-color);
            font-size: 1.2rem;
            background: white;
            padding: 2px 10px;
            border-radius: 20px;
            border: 2px solid var(--warning-color);
        }

        #mission-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        #status {
            font-size: 1.2rem;
            font-weight: bold;
            height: 40px;
            margin: 10px 0;
            color: var(--accent-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #008ba3;
        }

        .hidden { display: none !important; }

        #progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.1s;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧘‍♀️ AI 포즈 챌린지</h1>

        <div id="start-screen">
            <p>카메라 앞에서 랜덤 포즈를 맞춰보세요!<br>총 3문제가 출제됩니다.</p>
            <button id="start-btn" onclick="init()">게임 시작하기</button>
            <p id="loading-msg" class="hidden">AI 모델을 불러오고 있습니다...</p>
        </div>

        <div id="game-screen" class="hidden">
            <div id="mission-box">
                <div class="mission-header">
                    <div>미션 <span id="current-num">1</span> / 3</div>
                    <div id="timer-display">5.0s</div>
                </div>
                <div id="mission-name">준비 중...</div>
                <div id="mission-description" style="font-size: 0.9rem; color: #666;"></div>
                <div class="progress-bar"><div id="progress-fill"></div></div>
            </div>
            <div id="canvas-container"><canvas id="canvas"></canvas></div>
            <div id="status">포즈를 취해주세요!</div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>챌린지 완료! 🎉</h2>
            <div id="final-score-display" style="font-size: 3rem; font-weight: bold; color: var(--primary-color);">0 / 3</div>
            <p id="save-status" style="color: #888;">데이터 기록 중...</p>
            <button onclick="location.reload()">다시 도전하기</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    
    <script>
        // [중요] 본인의 티쳐블 머신 주소와 구글 앱스 스크립트 주소를 넣으세요
        const TM_URL = "https://teachablemachine.withgoogle.com/models/3D-S4mtMp/"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxRptOYQ6qOdURuDFoPxXVPucPOqyR1nOph7ttNfgCSeC-opTYZUu83qwZLVT1oDktaUQ/exec"; 

        let model, webcam, ctx;
        let selectedMissions = [];
        let currentIdx = 0;
        let score = 0;
        let isGameRunning = false;
        let holdCounter = 0;
        const REQUIRED_HOLD_FRAMES = 15;
        const ACCURACY_THRESHOLD = 0.70;
        let timeLeft = 5;
        let timerInterval = null;

        const poseDescriptions = {
            "경례": "왼손으로 경례하세요.",
            "하트": "머리 위로 큰 하트 그려주세요.",
            "궁수": "왼손으로 화살을 쏴주세요.",
            "양손 머리 위로 들기": "손바닥 쫙피고 정면에서 두 손을 들어주세요."
        };

        async function init() {
            document.getElementById("start-btn").classList.add("hidden");
            document.getElementById("loading-msg").classList.remove("hidden");

            try {
                model = await tmPose.load(TM_URL + "model.json", TM_URL + "metadata.json");
                const allLabels = model.getClassLabels().filter(l => !['none', '배경', 'background'].includes(l.toLowerCase()));
                selectedMissions = allLabels.sort(() => 0.5 - Math.random()).slice(0, 3);

                webcam = new tmPose.Webcam(200, 200, true);
                await webcam.setup();
                await webcam.play();
                
                document.getElementById("start-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");
                
                const canvas = document.getElementById("canvas");
                canvas.width = 200; canvas.height = 200;
                ctx = canvas.getContext("2d");

                window.requestAnimationFrame(loop);
                startNextMission();
            } catch (e) {
                alert("카메라를 실행할 수 없습니다.");
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            // 포즈 그리기
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
                tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
            }

            if (isGameRunning) {
                const target = selectedMissions[currentIdx];
                const p = prediction.find(res => res.className === target);

                if (p && p.probability > ACCURACY_THRESHOLD) {
                    holdCounter++;
                    document.getElementById("progress-fill").style.width = (holdCounter / REQUIRED_HOLD_FRAMES * 100) + "%";
                    if (holdCounter >= REQUIRED_HOLD_FRAMES) success();
                } else {
                    holdCounter = 0;
                    document.getElementById("progress-fill").style.width = "0%";
                }
            }
        }

        function startNextMission() {
            if (currentIdx >= selectedMissions.length) {
                endGame();
                return;
            }
            const name = selectedMissions[currentIdx];
            document.getElementById("current-num").innerText = currentIdx + 1;
            document.getElementById("mission-name").innerText = `"${name}"`;
            document.getElementById("mission-description").innerText = poseDescriptions[name] || "";
            isGameRunning = true;
            holdCounter = 0;
            startTimer();
        }

        function startTimer() {
            timeLeft = 5;
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById("timer-display").innerText = timeLeft.toFixed(1) + "s";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    currentIdx++;
                    startNextMission();
                }
            }, 100);
        }

        function success() {
            isGameRunning = false;
            clearInterval(timerInterval);
            score++;
            document.getElementById("status").innerText = "성공! 👏";
            setTimeout(() => {
                currentIdx++;
                document.getElementById("status").innerText = "포즈를 취해주세요!";
                startNextMission();
            }, 1000);
        }

        // 🎯 [핵심] 게임 종료 시 데이터 전송
        function endGame() {
            isGameRunning = false;
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score-display").innerText = `${score} / 3`;

            // 시트로 전송할 데이터 뭉치기
            const payload = {
                timestamp: new Date().toLocaleString(),
                score: score,
                totalMissions: selectedMissions.length,
                missionList: selectedMissions.join(", ")
            };

            // 구글 앱스 스크립트로 쏘기
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById("save-status").innerText = "데이터가 구글 시트에 저장되었습니다! ✅";
            }).catch(() => {
                document.getElementById("save-status").innerText = "저장 실패 ❌";
            });
        }
    </script>
</body>
</html>
