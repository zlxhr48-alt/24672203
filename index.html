<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 포즈 맞추기 게임</title>
    <style>
        :root {
            --primary-color: #00bcd4;
            --secondary-color: #006064;
            --bg-color: #e0f7fa;
            --accent-color: #d81b60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 { color: var(--secondary-color); margin-top: 0; }

        #canvas-container {
            position: relative;
            margin: 20px auto;
            width: 200px;
            height: 200px;
            border: 6px solid #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #mission-box {
            background-color: #fff9c4;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 2px dashed #fbc02d;
        }

        .mission-title {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 5px;
        }

        #mission-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        #mission-description {
            font-size: 1rem;
            color: #555;
            background: rgba(255,255,255,0.5);
            padding: 5px;
            border-radius: 5px;
            line-height: 1.4;
        }

        #status {
            font-size: 1.2rem;
            font-weight: bold;
            height: 40px;
            margin: 10px 0;
            color: var(--accent-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #008ba3;
        }

        button:hover {
            background-color: #26c6da;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .hidden { display: none !important; }

        #final-score-display {
            font-size: 4rem;
            color: var(--primary-color);
            margin: 20px 0;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧘‍♀️ AI 포즈 챌린지</h1>

        <!-- Start Screen -->
        <div id="start-screen">
            <p>카메라 앞에서 랜덤 포즈를 맞춰보세요!<br>총 3문제가 출제됩니다.</p>
            <p style="font-size:0.85rem; color:#888;">70% 이상의 정확도로 유지하면 성공!</p>
            <br>
            <button id="start-btn" onclick="init()">게임 시작하기</button>
            <p id="loading-msg" class="hidden">인공지능 모델을 불러오고 있습니다...</p>
        </div>

        <!-- Game Play Screen -->
        <div id="game-screen" class="hidden">
            <div id="mission-box">
                <div class="mission-title">미션 <span id="current-num">1</span> / 3</div>
                <div id="mission-name">준비 중...</div>
                <div id="mission-description">미션 설명을 불러오는 중...</div>
                <div class="progress-bar"><div id="progress-fill"></div></div>
            </div>

            <div id="canvas-container">
                <canvas id="canvas"></canvas>
            </div>

            <div id="status">포즈를 취해주세요!</div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden">
            <h2>챌린지 완료! 🎉</h2>
            <p>당신의 최종 점수는?</p>
            <div id="final-score-display">0 / 3</div>
            <button onclick="location.reload()">다시 도전하기</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    
    <script type="text/javascript">
        // Teachable Machine Model URL
        const URL = "https://teachablemachine.withgoogle.com/models/3D-S4mtMp/"; 
        
        let model, webcam, ctx, maxPredictions;
        let selectedMissions = [];
        let currentIdx = 0;
        let score = 0;
        let isGameRunning = false;
        
        let holdCounter = 0;
        const REQUIRED_HOLD_FRAMES = 15; 
        const ACCURACY_THRESHOLD = 0.70;

        // 포즈별 설명 매핑 (요청하신 설명 추가)
        const poseDescriptions = {
            "경례": "왼손으로 경례하세요.",
            "하트": "머리 위로 큰 하트 그려주세요.",
            "궁수": "왼손으로 화살을 쏴주세요.",
            "양손 머리 위로 들기": "손바닥 쫙피고 정면에서 두 손을 들어주세요."
        };

        async function init() {
            document.getElementById("start-btn").classList.add("hidden");
            document.getElementById("loading-msg").classList.remove("hidden");

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmPose.load(modelURL, metadataURL);
                const allLabels = model.getClassLabels();

                // 'none', 'background', '배경' 등 제외
                const filteredLabels = allLabels.filter(label => 
                    label.toLowerCase() !== 'none' && 
                    label.toLowerCase() !== 'background' && 
                    label !== '배경'
                );

                selectedMissions = [];
                // 실제 학습된 클래스 개수가 3개보다 적을 경우를 대비
                const missionCount = Math.min(3, filteredLabels.length);
                
                // 랜덤하게 미션 섞기
                const shuffled = filteredLabels.sort(() => 0.5 - Math.random());
                selectedMissions = shuffled.slice(0, missionCount);

                const size = 200;
                const flip = true; 
                webcam = new tmPose.Webcam(size, size, flip); 
                await webcam.setup(); 
                await webcam.play();
                
                window.requestAnimationFrame(loop);

                const canvas = document.getElementById("canvas");
                canvas.width = size; canvas.height = size;
                ctx = canvas.getContext("2d");

                document.getElementById("start-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");
                
                isGameRunning = true;
                updateDisplay();

            } catch (e) {
                console.error(e);
                alert("모델 로드 실패. 카메라 권한과 인터넷 연결을 확인해주세요.");
                location.reload();
            }
        }

        function updateDisplay() {
            if (currentIdx >= selectedMissions.length) {
                endGame();
                return;
            }
            
            const missionName = selectedMissions[currentIdx];
            document.getElementById("current-num").innerText = currentIdx + 1;
            document.getElementById("mission-name").innerText = `"${missionName}"`;
            
            // 설명 업데이트
            const description = poseDescriptions[missionName] || "정확한 포즈를 취해주세요!";
            document.getElementById("mission-description").innerText = description;
            
            document.getElementById("status").innerText = "동작을 시작하세요!";
            document.getElementById("status").style.color = "#d81b60";
            document.getElementById("progress-fill").style.width = "0%";
            holdCounter = 0;
        }

        async function loop(timestamp) {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            drawPose(pose);

            if (isGameRunning && currentIdx < selectedMissions.length) {
                const target = selectedMissions[currentIdx];
                const targetPredict = prediction.find(p => p.className === target);

                if (targetPredict && targetPredict.probability >= ACCURACY_THRESHOLD) {
                    holdCounter++;
                    const percent = (holdCounter / REQUIRED_HOLD_FRAMES) * 100;
                    document.getElementById("progress-fill").style.width = percent + "%";
                    document.getElementById("status").innerText = "좋아요! 유지하세요!";
                    document.getElementById("status").style.color = "#00bcd4";

                    if (holdCounter >= REQUIRED_HOLD_FRAMES) {
                        success();
                    }
                } else {
                    holdCounter = 0;
                    document.getElementById("progress-fill").style.width = "0%";
                    document.getElementById("status").innerText = "정확도를 높여주세요 (70%↑)";
                    document.getElementById("status").style.color = "#d81b60";
                }
            }
        }

        function success() {
            isGameRunning = false;
            score++;
            document.getElementById("status").innerText = "완벽합니다! +1점 👏";
            document.getElementById("status").style.color = "green";

            setTimeout(() => {
                currentIdx++;
                isGameRunning = true;
                updateDisplay();
            }, 1500);
        }

        function endGame() {
            isGameRunning = false;
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score-display").innerText = `${score} / ${selectedMissions.length}`;
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
